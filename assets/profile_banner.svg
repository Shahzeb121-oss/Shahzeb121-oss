<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070912"/>
      <stop offset="55%" stop-color="#0a0f1f"/>
      <stop offset="100%" stop-color="#0d0a1a"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472d6"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>

    <radialGradient id="glowSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#1b2338" stroke-width="1"/>
    </pattern>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="panelClip">
      <rect x="14" y="14" width="1172" height="352" rx="18"/>
    </clipPath>

    <style>
      @keyframes scan {
        0%   { transform: translateY(0); opacity: 0; }
        8%   { opacity: 0.9; }
        92%  { opacity: 0.9; }
        100% { transform: translateY(352px); opacity: 0; }
      }
      @keyframes blink {
        0%, 45% { opacity: 1; }
        50%, 95% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.55; r: 4.5; }
        50% { opacity: 1; r: 6; }
      }
      @keyframes drift1 { 0% { transform: translate(0,0); } 50% { transform: translate(14px,-18px); } 100% { transform: translate(0,0); } }
      @keyframes drift2 { 0% { transform: translate(0,0); } 50% { transform: translate(-18px,14px); } 100% { transform: translate(0,0); } }
      @keyframes drift3 { 0% { transform: translate(0,0); } 50% { transform: translate(10px,16px); } 100% { transform: translate(0,0); } }
      @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes fadeUp { 0% { opacity:0; transform: translateY(6px);} 100% { opacity:1; transform: translateY(0);} }

      .scanline { animation: scan 4.5s ease-in-out infinite; }
      .cursor { animation: blink 1.1s step-end infinite; }
      .statusDot { animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .p1 { animation: drift1 6s ease-in-out infinite; }
      .p2 { animation: drift2 7.5s ease-in-out infinite; }
      .p3 { animation: drift3 5.2s ease-in-out infinite; }
      .p4 { animation: drift1 9s ease-in-out infinite; }
      .p5 { animation: drift2 6.8s ease-in-out infinite; }
      .ring { animation: spinSlow 14s linear infinite; transform-box: fill-box; transform-origin: center; }
      .ring2 { animation: spinSlow 20s linear infinite reverse; transform-box: fill-box; transform-origin: center; }
      .row { animation: fadeUp 0.6s ease-out both; }
      .row1 { animation-delay: .05s; }
      .row2 { animation-delay: .15s; }
      .row3 { animation-delay: .25s; }
      .row4 { animation-delay: .35s; }
      .row5 { animation-delay: .45s; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    </style>
  </defs>

  <!-- outer glow border -->
  <rect x="8" y="8" width="1184" height="364" rx="22" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" filter="url(#softGlow)"/>

  <!-- panel -->
  <rect x="14" y="14" width="1172" height="352" rx="18" fill="url(#bgGrad)"/>
  <rect x="14" y="14" width="1172" height="352" rx="18" fill="url(#grid)" opacity="0.55"/>
  <rect x="14" y="14" width="1172" height="352" rx="18" fill="url(#glowSpot)"/>

  <g clip-path="url(#panelClip)">
    <!-- floating particles for depth -->
    <circle class="p1" cx="1040" cy="70" r="2.5" fill="#67e8f9" opacity="0.8"/>
    <circle class="p2" cx="1105" cy="150" r="3.5" fill="#c4b5fd" opacity="0.7"/>
    <circle class="p3" cx="960" cy="260" r="2" fill="#f0abfc" opacity="0.75"/>
    <circle class="p4" cx="1130" cy="290" r="2.5" fill="#67e8f9" opacity="0.6"/>
    <circle class="p5" cx="1000" cy="330" r="2" fill="#c4b5fd" opacity="0.65"/>

    <!-- decorative rotating rings (right side, 3D-ish orbit motif) -->
    <g transform="translate(1040,190)" opacity="0.5">
      <ellipse class="ring" rx="95" ry="34" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
      <ellipse class="ring2" rx="95" ry="34" fill="none" stroke="#c084fc" stroke-width="1" transform="rotate(60)"/>
      <ellipse rx="95" ry="34" fill="none" stroke="#f0abfc" stroke-width="0.8" transform="rotate(120)"/>
      <circle r="7" fill="#a78bfa" filter="url(#softGlow)"/>
    </g>

    <!-- window chrome -->
    <circle cx="46" cy="46" r="6" fill="#f87171"/>
    <circle cx="66" cy="46" r="6" fill="#fbbf24"/>
    <circle cx="86" cy="46" r="6" fill="#34d399"/>
    <text x="112" y="51" class="mono" font-size="13" fill="#6b7a99">AI_PROFILE.exe</text>
    <line x1="14" y1="70" x2="900" y2="70" stroke="#1b2338" stroke-width="1"/>

    <!-- scanline -->
    <rect class="scanline" x="14" y="70" width="886" height="2" fill="#67e8f9" opacity="0.5"/>

    <!-- boot text -->
    <text x="46" y="98" class="mono row row1" font-size="13" fill="#34d399">$ initializing neural_profile <tspan fill="#6b7a99">// 100% complete</tspan></text>

    <!-- name -->
    <text x="46" y="150" class="row row2" font-family="Verdana, Geneva, sans-serif" font-size="38" font-weight="700" fill="url(#nameGrad)" filter="url(#softGlow)">
      Muhammad Shahzaib<tspan class="cursor" fill="#67e8f9">▌</tspan>
    </text>

    <!-- info rows -->
    <g class="mono" font-size="15">
      <text x="46" y="190" class="row row3" fill="#8b98b8">🎓 Role &#160;&#160;&#160;<tspan fill="#e6f1ff">BS Artificial Intelligence</tspan></text>
      <text x="46" y="220" class="row row4" fill="#8b98b8">🚀 Focus &#160;&#160;<tspan fill="#e6f1ff">Machine Learning • Data Science • NLP • GenAI</tspan></text>
      <text x="46" y="250" class="row row5" fill="#8b98b8">⚙️ Building<tspan fill="#e6f1ff"> AI Projects &amp; Automation</tspan></text>
      <text x="46" y="280" class="row row5" fill="#8b98b8">🎯 Goal &#160;&#160;&#160;<tspan fill="#e6f1ff">AI Engineer</tspan></text>
    </g>

    <!-- status bar -->
    <line x1="14" y1="308" x2="900" y2="308" stroke="#1b2338" stroke-width="1"/>
    <circle class="statusDot" cx="52" cy="335" r="5" fill="#34d399"/>
    <text x="66" y="340" class="mono" font-size="13" fill="#34d399">SYSTEM STATUS: ONLINE</text>
    <text x="1155" y="340" class="mono" font-size="12" fill="#44506e" text-anchor="end">v2026.08</text>
  </g>
</svg>
