<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fadeMaskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="18%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="78%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fadeMask">
      <rect x="0" y="0" width="1200" height="380" fill="url(#fadeMaskGrad)"/>
    </mask>

    <linearGradient id="panelBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="50%" stop-color="#00ffc8"/>
      <stop offset="100%" stop-color="#00ff66"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="panelGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#003b18" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#000905" stop-opacity="0.98"/>
    </radialGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      @keyframes fall {
        from { transform: translateY(-260px); }
        to   { transform: translateY(420px); }
      }
      @keyframes blink {
        0%, 45% { opacity: 1; }
        50%, 95% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes scan {
        0% { transform: translateY(0); opacity: 0; }
        10% { opacity: 0.8; }
        90% { opacity: 0.8; }
        100% { transform: translateY(300px); opacity: 0; }
      }
      @keyframes glitchShift {
        0%, 92%, 100% { transform: translate(0,0); opacity: 0; }
        93% { transform: translate(-3px,0); opacity: 0.85; }
        94% { transform: translate(3px,0); opacity: 0.85; }
        95% { transform: translate(-2px,0); opacity: 0.6; }
        96% { transform: translate(0,0); opacity: 0; }
      }
      @keyframes flicker {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.92; }
      }
      .mono { font-family: Consolas, Menlo, 'Liberation Mono', monospace; }
      .cursor { animation: blink 1s step-end infinite; }
      .scanline { animation: scan 5s ease-in-out infinite; }
      .glitchRed { animation: glitchShift 7s steps(1) infinite; }
      .glitchCyan { animation: glitchShift 7s steps(1) infinite reverse; }
      .nameFlicker { animation: flicker 3.2s ease-in-out infinite; }
      .c0 { animation: fall 4.7s linear infinite; animation-delay: -8.2s; }
      .c1 { animation: fall 7.4s linear infinite; animation-delay: -1.7s; }
      .c2 { animation: fall 5.0s linear infinite; animation-delay: -8.1s; }
      .c3 { animation: fall 8.9s linear infinite; animation-delay: -5.7s; }
      .c4 { animation: fall 8.7s linear infinite; animation-delay: -7.5s; }
      .c5 { animation: fall 5.4s linear infinite; animation-delay: -2.4s; }
      .c6 { animation: fall 8.6s linear infinite; animation-delay: -1.8s; }
      .c7 { animation: fall 8.9s linear infinite; animation-delay: -3.2s; }
      .c8 { animation: fall 6.3s linear infinite; animation-delay: -0.0s; }
      .c9 { animation: fall 6.4s linear infinite; animation-delay: -3.6s; }
      .c10 { animation: fall 6.0s linear infinite; animation-delay: -7.6s; }
      .c11 { animation: fall 6.4s linear infinite; animation-delay: -7.5s; }
      .c12 { animation: fall 5.7s linear infinite; animation-delay: -6.8s; }
      .c13 { animation: fall 6.9s linear infinite; animation-delay: -4.1s; }
      .c14 { animation: fall 6.4s linear infinite; animation-delay: -0.9s; }
      .c15 { animation: fall 5.7s linear infinite; animation-delay: -7.0s; }
      .c16 { animation: fall 5.6s linear infinite; animation-delay: -7.8s; }
      .c17 { animation: fall 6.6s linear infinite; animation-delay: -1.2s; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="380" fill="#000603"/>

